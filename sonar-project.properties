# SonarCloud project configuration for YSE Sound Engine
#
# Prerequisites before first scan:
#   1. Create a project in SonarCloud (sonarcloud.io) and note the projectKey and organization.
#   2. Replace the placeholder values for sonar.projectKey and sonar.organization below.
#   3. Add a SONAR_TOKEN secret to the GitHub repository (Settings → Secrets → Actions).
#      The secret name must match what is used in .github/workflows/ci.yml.
#
# The scan is driven by the GitHub Actions workflow; you do not need to run the
# sonar-scanner CLI locally.

# ── Project identity ──────────────────────────────────────────────────────────
# Replace with values from your SonarCloud project settings page.
sonar.projectKey=yvanvds_yse-soundengine
sonar.organization=yvanvds
sonar.projectName=YSE Sound Engine
sonar.projectVersion=1.0.77

# ── Source / test roots ───────────────────────────────────────────────────────
sonar.sources=YseEngine
sonar.tests=Tests

# ── Exclusions ────────────────────────────────────────────────────────────────
# Keep the analysis focused on the core engine.  All vendored dependencies,
# out-of-tree build directories, legacy platform projects, and Android projects
# are excluded.
#
# The list also covers vendored / ported third-party sources that live *inside*
# YseEngine/ rather than under dependencies/ (the MSFA FM port, the JSON
# library, the atomic/queue helpers).  Those files are kept byte-identical to
# upstream so they can be re-synced and diffed against it, which means analyzer
# findings there cannot be fixed in place -- see CLAUDE.md rule 4, "Don't
# modify vendored deps".
#
# Every line below except the last must end in a backslash continuation, with
# no trailing whitespace after it, or the whole list is silently dropped.
sonar.exclusions=\
  dependencies/**,\
  YseEngine/dsp/fm/msfa/**,\
  YseEngine/json/**,\
  YseEngine/utils/json.hpp,\
  YseEngine/utils/atomicOps.hpp,\
  YseEngine/utils/lfQueue.hpp,\
  build/**,\
  build-debug/**,\
  Demo.Windows.Native/**,\
  Tests/Android/**,\
  Yse.Windows.Native/**,\
  YseCppRelease/**,\
  GeneratePackage/**,\
  cmake/**

# `sonar.exclusions` only filters what is indexed under `sonar.sources`
# (YseEngine).  Files that land under `sonar.tests` (Tests) are filtered by
# `sonar.test.exclusions` instead, so listing Tests/Android/** above never
# excluded it: the scanner indexes the harness' Gradle scripts as *test*
# files -- SonarCloud reports them with the UTS (unit-test) qualifier -- and
# went on raising kotlin/text findings against them.  See #411.
#
# Tests/Android/ is an on-device test-harness APK, not a shipped artefact.
# R8 obfuscation and Gradle dependency locking there guard nothing that ships,
# so the harness is excluded rather than "hardened".
#
# Same continuation rule as above: every line except the last must end in a
# backslash with no trailing whitespace after it.
sonar.test.exclusions=\
  Tests/Android/**

# ── Issue exclusions ─────────────────────────────────────────────────────────
# cpp:S8417 ("use std::memory_order_seq_cst") is suppressed project-wide.
#
# The engine's relaxed / acquire-release orderings are deliberate, reviewed
# design, not oversights: the seqlock in utils/atomicPos.h, the Vyukov MPMC
# queue in utils/mpmcQueue.hpp and the wait-free patcher graph all depend on
# precise acquire/release pairing for their correctness arguments.  Promoting
# them to seq_cst would emit full barriers (mfence / dmb ish) on the audio
# callback path -- worst on the ARM/Android target -- which CLAUDE.md rule 3
# forbids: "Never trade audio-thread speed for stylistic cleanliness."
#
# This would normally be a deactivated rule in a custom quality profile, but
# custom profiles are a paid SonarCloud feature and this project is on the
# free plan.  The two alternatives were both worse:
#   - 203 hand-placed `// NOSONAR` markers: clang-format's 100-column limit
#     counts the trailing comment and breaks the statement, relocating the
#     marker off the line the finding anchors to (verified experimentally;
#     `ReflowComments: false` does not change it).  See #409 for the same
#     failure mode biting four existing markers.
#   - Server-side "Accepted" transitions: works, but every newly written
#     relaxed atomic re-raises the finding, so the gate needs re-clearing on
#     every lock-free change.
#
# Suppressing here keeps the decision in-repo, version-controlled and reviewed
# with the code it applies to.  See #413.
#
# NOTE: this suppresses S8417 only.  A genuinely wrong memory ordering is a
# real bug and is caught by the TSan leg of the `build-sanitizers` CI job, not
# by this rule -- blanket seq_cst would have hidden such bugs rather than
# surface them.
sonar.issue.ignore.multicriteria=s8417
sonar.issue.ignore.multicriteria.s8417.ruleKey=cpp:S8417
sonar.issue.ignore.multicriteria.s8417.resourceKey=**/*

# ── C++ analyser: compile commands ───────────────────────────────────────────
# compile_commands.json is generated by CMake when CMAKE_EXPORT_COMPILE_COMMANDS=ON
# (set unconditionally in the root CMakeLists.txt).  The coverage build in CI
# writes it to the build/ directory.
sonar.cfamily.compile-commands=build/compile_commands.json

# ── Coverage report ───────────────────────────────────────────────────────────
# Generated by gcovr --sonarqube in the CI workflow.
sonar.coverageReportPaths=coverage.xml

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

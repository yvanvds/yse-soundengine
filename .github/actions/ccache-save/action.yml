name: Report and save compile cache
description: >
  Prints the ccache counters for this run and, on a push to dev, saves the cache
  (#1271). Run it last, with `if: !cancelled() && steps.<ccache-restore id>.outcome == 'success'`,
  so a failed test still reports and keeps the objects it compiled.

runs:
  using: composite
  steps:
    - name: Show ccache statistics
      shell: bash
      run: ccache -s -v
    - name: Save the cache
      # Saves from dev pushes only. A PR can read its base branch's caches, but
      # dev can't read a PR's, so a PR's save would never reach another branch.
      # The repo has 10 GB of cache with LRU eviction, and a save per PR push
      # would spend it on entries nothing else can use.
      if: github.event_name == 'push' && github.ref_name == 'dev'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ${{ env.CCACHE_KEY }}
